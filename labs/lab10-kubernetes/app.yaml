# Lab 10 · App de dados con auto-instrumentación inyectada por el Operator.
# La anotación inject-python del template del pod hace que el Operator agregue el
# init container "opentelemetry-auto-instrumentation" y las variables OTEL_*.
# Fuente: https://opentelemetry.io/docs/platforms/kubernetes/operator/automatic/#add-annotations-to-existing-deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dice-app
  namespace: otca
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dice-app
  template:
    metadata:
      labels:
        app: dice-app
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      containers:
        - name: dice-app
          image: dice-app:lab10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dice-app
  namespace: otca
spec:
  selector:
    app: dice-app
  ports:
    - port: 8080
      targetPort: 8080
