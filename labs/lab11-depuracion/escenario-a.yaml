# Lab 11 · Escenario A — esta configuración NO arranca.
# Tiene un error que "otelcol-contrib validate" detecta antes de desplegar.
# Encuéntralo leyendo el mensaje de validate (no mires escenario-a-solucion.yaml antes).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp_grpc/jager, debug]
