# Lab 11 · Escenario B — solución.
#  1. El receiver gRPC escuchaba en localhost:4317: dentro de un contenedor eso es
#     solo su propia interfaz de loopback, así que las apps de fuera no conectan
#     (StatusCode.UNAVAILABLE). Se usa 0.0.0.0:4317 (el Collector usa localhost
#     por defecto por seguridad: https://opentelemetry.io/docs/collector/configuration/).
#  2. otlp_grpc/jaeger estaba configurado pero no en el pipeline de traces:
#     configurar un componente NO lo activa; hay que añadirlo a un pipeline.
#  3. Lo mismo con el exporter prometheus en el pipeline de metrics.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch: {}

exporters:
  debug:
    verbosity: detailed
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
