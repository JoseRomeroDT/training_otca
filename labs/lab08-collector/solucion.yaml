# Lab 8 · Solución: Collector con las 3 señales enrutadas a sus backends.
#
#   traces  : otlp → memory_limiter, resource/lab, batch → otlp_grpc/jaeger, debug
#   metrics : otlp → memory_limiter, resource/lab, batch → prometheus
#   logs    : otlp → memory_limiter, resource/lab, batch → debug/detallado
#
# Referencias:
#   https://opentelemetry.io/docs/collector/configuration/
#   https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/README.md#recommended-processors

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 1.º siempre: protege al Collector de quedarse sin memoria.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  # Enriquecer: agrega/actualiza un atributo del Resource en todas las señales.
  resource/lab:
    attributes:
      - key: deployment.environment.name
        value: lab
        action: upsert
  # Al final: agrupa en lotes antes de exportar.
  batch: {}

exporters:
  debug:
    verbosity: basic
  debug/detallado:
    verbosity: detailed
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, zpages, pprof]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/lab, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/lab, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/lab, batch]
      exporters: [debug/detallado]
