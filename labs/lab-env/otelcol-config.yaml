# Configuración "del curso" del OpenTelemetry Collector (labs 2 a 7).
# Recibe OTLP de las apps y envía:
#   - trazas   → Jaeger (otlp_grpc)        y un resumen a la consola (debug)
#   - métricas → endpoint para Prometheus  y un resumen a la consola (debug)
#   - logs     → consola con detalle (debug/detallado)
# En el Lab 8 escribes tu propia versión y la activas con use-collector-config.sh.
# Referencia: https://opentelemetry.io/docs/collector/configuration/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Primero el memory_limiter, al final el batch (orden recomendado).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch: {}

exporters:
  debug:
    verbosity: basic
  debug/detallado:
    verbosity: detailed
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  pprof:
    endpoint: 0.0.0.0:1777

service:
  extensions: [health_check, zpages, pprof]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug/detallado]
