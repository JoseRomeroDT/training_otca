# Lab 9 · Collector en modo AGENT (contenedor otel-collector).
# Recibe OTLP de las apps (localhost:4317/4318) y reenvía TODO al gateway.
# Patrón agent → gateway: https://opentelemetry.io/docs/collector/deploy/

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  resource/agent:
    attributes:
      - key: lab.collector.agent
        value: otel-collector
        action: upsert

exporters:
  # Batching en el exporter (sending_queue.batch): la forma que hoy recomienda la
  # documentación del Collector en lugar del processor "batch".
  otlp_grpc/gateway:
    endpoint: otel-gateway:4317
    tls:
      insecure: true
    sending_queue:
      batch: {}
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/agent]
      exporters: [otlp_grpc/gateway, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/agent]
      exporters: [otlp_grpc/gateway, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/agent]
      exporters: [otlp_grpc/gateway, debug]
